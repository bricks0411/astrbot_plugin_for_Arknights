name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: astrbot_plugin_for_Arknights

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            astrbot_plugin_for_Arknights/requirements.txt
            astrbot_plugin_for_Arknights/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r astrbot_plugin_for_Arknights/requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q -f astrbot_plugin_for_Arknights

      - name: Run static checks
        run: >-
          python -m ruff check
          --select E9,F63,F7,F82
          astrbot_plugin_for_Arknights

      - name: Validate plugin metadata
        run: >-
          python -c
          "import pathlib, yaml; data = yaml.safe_load(pathlib.Path('astrbot_plugin_for_Arknights/metadata.yaml').read_text(encoding='utf-8')); required = {'name', 'display_name', 'desc', 'version', 'author', 'repo'}; missing = required - data.keys(); assert not missing, f'missing metadata fields: {sorted(missing)}'"

      - name: Run unit tests
        run: >-
          python -m unittest discover
          -s astrbot_plugin_for_Arknights/tests
          -t .
          -v
